<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box} body{margin:0}
.slide-container{width:1280px;min-height:720px;background:#f7fafc;color:#10202b;font-family:Arial,Helvetica,sans-serif;display:flex;position:relative;overflow:hidden}
.left{width:760px;padding:86px 72px 0 86px}
.kicker{font-size:14px;letter-spacing:3px;color:#1d7896;font-weight:700;margin-bottom:24px}
.title{font-size:54px;line-height:1.02;max-width:660px;margin:0 0 24px;font-weight:800}
.subtitle{font-size:22px;color:#5e7180;line-height:1.35;max-width:600px}
.rule{width:220px;height:5px;background:#42b7d6;margin-top:38px}
.right{flex:1;background:#0b2638;padding:60px 58px;color:#d9f7ff;position:relative}
.right:before{content:"";position:absolute;left:0;top:0;width:8px;height:100%;background:#42b7d6}
.metric{border-top:1px solid #3f7185;padding:12px 0 10px}
.num{font-size:68px;font-weight:800;line-height:1}
.label{font-size:16px;letter-spacing:2px;color:#86b9c8;margin-top:8px}
.route-lines{margin-top:24px}
.line{height:12px;border-top:2px solid #28c9ee;margin:10px 0;opacity:.8}
.line:nth-child(2){width:86%}.line:nth-child(3){width:62%}.line:nth-child(4){width:93%}.line:nth-child(5){width:48%}.line:nth-child(6){width:74%}
.footer{position:absolute;left:86px;bottom:28px;color:#86b9c8;font-size:13px;letter-spacing:1px}
</style>
</head>
<body>
<div class="slide-container"><div class="left"><div class="kicker">UNIVERSE CIVILIZATION · EMPIRE AT WARS</div><h1 class="title">191-Route Game Architecture</h1><p class="subtitle">Live interface verification, generated page layers, detailed gameplay specifications, and delivery status.</p><div class="rule"></div></div><div class="right"><div class="metric"><div class="num">191</div><div class="label">ACTIVE ROUTES</div></div><div class="metric"><div class="num">28</div><div class="label">NAVIGATION GROUPS</div></div><div class="route-lines"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div></div><div class="footer">ROUTE AUDIT · LIVE TEST · ARCHITECTURE REPORT</div></div>
</body>
</html>
